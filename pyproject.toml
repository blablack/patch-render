[build-system]
requires = ["scikit-build-core>=1.0.3", "pybind11>=3.0.4", "setuptools-scm>=10.2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "patch-render"
dynamic = ["version"]
requires-python = ">=3.14"
description = "Headless VST3 offline renderer (Python extension)"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.uv]
# patch_render itself is a local compiled artifact (CMake/Ninja + JUCE, not something
# uv builds/installs) — `uv sync` should only manage the dev group's venv below.
package = false

[dependency-groups]
dev = ["pyyaml>=6.0"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.cibuildwheel]
build  = "cp314-*"
skip   = ["*-musllinux*", "*-win32", "*-manylinux_i686"]
enable = ["cpython-prerelease"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64:latest"
before-all = """
    dnf install -y \
        alsa-lib-devel \
        mesa-libGL-devel \
        libX11-devel \
        libXrandr-devel \
        libXinerama-devel \
        libXcursor-devel \
        libXi-devel \
        freetype-devel \
        fontconfig-devel \
        libXcomposite-devel \
        libXext-devel \
        libXrender-devel
"""

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

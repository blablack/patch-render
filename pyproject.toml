[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "patch-render"
version = "0.1.0"
requires-python = ">=3.14"
description = "Headless VST3 offline renderer (Python extension)"

[tool.cibuildwheel]
build = "cp314-*"
skip  = ["*-musllinux*", "*-win32", "*-manylinux_i686"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = """
    dnf install -y \
        alsa-lib-devel \
        mesa-libGL-devel \
        libX11-devel \
        libXrandr-devel \
        libXinerama-devel \
        libXcursor-devel \
        libXi-devel \
        freetype-devel \
        fontconfig-devel \
        libXcomposite-devel \
        libXext-devel \
        libXrender-devel
"""

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
